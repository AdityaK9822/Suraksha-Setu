[package]
name = "suraksha-setu-kiosk"
version = "0.1.0"
edition = "2021"
resolver = "2"

[dependencies]
esp-backtrace = { version = "0.15", features = ["esp32s3", "panic-handler", "println"] }
esp-hal = { version = "0.23.1", features = ["esp32s3", "log"] }
esp-hal-embassy = { version = "0.6.0", features = ["esp32s3", "executors"] }
esp-wifi = { version = "0.12.0", features = ["esp32s3", "wifi", "smoltcp", "esp-alloc", "log"] }
esp-alloc = "0.6.0"
esp-println = { version = "0.13.0", features = ["esp32s3", "log"] }

embassy-executor = { version = "0.7", features = ["executor-thread", "timer-item-payload-size-4"] }
embassy-net = { version = "0.6", features = ["proto-ipv4", "tcp", "udp", "medium-ethernet", "dhcpv4"] }
embassy-time = "0.4"
embassy-sync = "0.6"
embedded-io-async = "0.6"
static_cell = "2.1"

tiny-keccak = { version = "2", features = ["keccak"] }
ssd1306 = { version = "0.9", features = ["graphics"] }
embedded-graphics = "0.8"
heapless = "0.8"
log = "0.4"

[profile.release]
opt-level = 2
lto = true

[profile.dev]
opt-level = 1
debug = 2
